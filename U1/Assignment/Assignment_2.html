<!DOCTYPE html>
<html>
<head>
    <title>Product Comparison</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 20px;
            color: rgb(0, 0, 0);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        table {
            margin: auto;
            border-collapse: collapse;
            width: 90%;
            background: rgba(71, 71, 71, 0.51);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        th, td {
            padding: 15px;
            text-align: center;
        }

        th {
            background: rgba(255, 255, 255, 0.1);
            font-size: 18px;
        }

        td {
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        tr:hover {
            background: rgba(255,255,255,0.05);
        }

        input[type="checkbox"] {
            transform: scale(1.3);
            cursor: pointer;
            margin-top: 8px;
        }

        .highlight {
            background: linear-gradient(135deg, #097a99, #023575);
            color: white;
            font-weight: bold;
            transform: scale(1.02);
            transition: 0.3s ease;
        }

        td, th {
            transition: all 0.3s ease;
        }

    </style>
</head>

<body>

<h2>Product Comparison</h2>

<table id="productTable">
    <tr>
        <th>Feature</th>
        <th>
            Redmi Note 10<br>
            <input type="checkbox" onclick="highlightColumn(1, this)">
        </th>
        <th>
            Redmi Note 11<br>
            <input type="checkbox" onclick="highlightColumn(2, this)">
        </th>
        <th>
            Motorola G10<br>
            <input type="checkbox" onclick="highlightColumn(3, this)">
        </th>
    </tr>

    <tr>
        <td>Price</td>
        <td>₹10,000</td>
        <td>₹12,000</td>
        <td>₹9,000</td>
    </tr>

    <tr>
        <td>Battery</td>
        <td>4000mAh</td>
        <td>4500mAh</td>
        <td>4200mAh</td>
    </tr>

    <tr>
        <td>Camera</td>
        <td>12MP</td>
        <td>16MP</td>
        <td>13MP</td>
    </tr>

    <tr>
        <td>Storage</td>
        <td>64GB</td>
        <td>128GB</td>
        <td>64GB</td>
    </tr>
</table>

<script>
    function highlightColumn(colIndex, checkbox) {
        let table = document.getElementById("productTable");
        let rows = table.rows;

        for (let i = 0; i < rows.length; i++) {
            let cell = rows[i].cells[colIndex];

            if (checkbox.checked) {
                cell.classList.add("highlight");
            } else {
                cell.classList.remove("highlight");
            }
        }
    }
</script>

</body>
</html>
