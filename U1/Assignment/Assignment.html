<!DOCTYPE html>
<html>
<head>
    <title>SRN Form</title>

    <script>

        function checkData()
        {
            var s = document.getElementById("srn").value;
            var sem = document.getElementById("sem").value;
            var pattern = /^[0-9][A-Z][A-Z][0-9][0-9][A-Z][A-Z][0-9][0-9][0-9]$/;
            if(s == "")
            {
                alert("Enter SRN first");
                return false;
            }

            if(!pattern.test(s))
            {
                alert("SRN format wrong");
                return false;
            }

            if(sem == "")
            {
                alert("Enter semester");
                return false;
            }

            if(sem < 1 || sem > 4)
            {
                alert("Semester should be 1 to 4 only");
                return false;
            }

            alert("Data is correct");
            return true;
        }

    </script>

</head>

<body>
    <h3>SRN Validation Program</h3>
    <form onsubmit="return checkData()">

        SRN :
        <input type="text" id="srn">
        <br><br>

        Semester :
        <input type="number" id="sem">
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
