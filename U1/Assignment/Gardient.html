<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradients</title>
    <style>
        body{
            background-image:linear-gradient(120deg , wheat,rgb(255, 255, 88),rgb(255, 180, 40));
            background-repeat: no-repeat;
            margin: 0;
            height:100vh;
            justify-content: center;
            align-items: center;
            display:flex;
            flex-direction: column;
        }
        h2{
            text-align: center;
            font-size: 40px;
            background-image: linear-gradient(to right, rgb(255, 19, 220),rgb(4, 4, 67));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .container{
            width:300px;
            height:300px;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(rgb(255, 106, 106),rgb(81, 0, 0));
            border-radius: 100%;
        }
    </style>
</head>
<body>
    <h2>Simple Gradients</h2>
    <div class="container"></div>
</body>
</html>
