<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        body{
            overflow: hidden;
            background-color: aliceblue;
        }
        h1{
            animation: fade-in 1.5s linear;
            font-weight: 800;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        p{
            scale:2;
            animation: zoom-in 1.5s linear infinite;
        }
        @keyframes fade-in{
            0%{
                opacity:0%;
            }100%{
                opacity:100;
            }
        }
        @keyframes zoom-in{
            0%{
                scale:1;
            }100%{
                scale:2;
            }
        }
    </style>
</head>
<body>
    <center>
    <h1>This is a text with basic animation</h1>
    <p>This is zoom-in anim</p>
    </center>
</body>
</html>
