<!DOCTYPE html>
<html>
<head>
    <title>CSS Types Example</title>

    <!-- Internal CSS -->
    <style>
        p {
            color: green;
            font-size: 18px;
        }

        .box {
            border: 2px solid black;
            padding: 10px;
            width: 200px;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h2>CSS Types Demonstration</h2>

    <p>This paragraph uses INTERNAL CSS</p>

    <div class="box" style="background-color: yellow;">
        This box uses INLINE CSS
    </div>

</body>
</html>
