<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        .tbl{
            display:flex;
            align-items: center;
            justify-content: center;
            height:100vh;
        }
        table{
            border: 3px solid black;
            width:max-content;
            /* height:300px; */
            background:linear-gradient(50deg,rgb(255, 250, 179), rgb(248, 221, 255));
        }
    </style>
</head>
<body>
    <div class="tbl">
    <table border="border" cellspacing="10" cellpadding="10">
        <thead><tr>
            <th>col1</th>
            <th>col2</th>
            <th>col3</th>
            <th>col4</th>
        </tr></thead>
        <tr>
        <td rowspan="2"></td>
        <th colspan="3">Fruit Juice Drinks</th>
        </tr>
        <tr>
            <th>Apple</th>
            <th>Orange</th>
            <th>Screwdriver</th>
        </tr>
        <tr align="center">
            <th>Breakfast</th>
            <td>0</td>
            <td>1</td>
            <td>0</td>
        </tr>
        <tr>
            <th>Lunch</th>
            <td>1</td>
            <td>0</td>
            <td>0</td>
        </tr>
        <tr>
            <th>align</th>
            <td align="left">Left</td>
            <td align="right">Right</td>
            <td align="center">Center</td>
        </tr>
        <tr>
            <th><br>valign <br> <br></th>
            <td>Default</td>
            <td valign="top">Top</td>
            <td valign="bottom">Bottom</td>
        </tr>
        <tr>
            <th>Nested Tbl</th>
            <td>hdhd</td>
            <td>ddfdff</td>
            <td>
                <table  border="border">
                    <tr><td>11</td><td>12</td></tr>
                    <tr><td>13</td><td>14</td></tr>
                </table>
            </td>
        </tr>
        <tfoot>
            <tr>
                <td colspan="4">This is Footer</td>
            </tr>
        </tfoot>
    </table>
    </div>
</body>
</html>
