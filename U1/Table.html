<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        .tbl{
            display:flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            height:100vh;
        }
        table{
            border: 3px solid black;
            width:max-content;
            height:300px;
            background:linear-gradient(50deg,rgb(255, 250, 179), rgb(248, 221, 255));
        }
    </style>
</head>
<body>
    <div class="tbl">
    <table border="border" cellspacing="10" cellpadding="10">
        <tr>
        <td rowspan="2"></td>
        <th colspan="3">Fruit Juice Drinks</th>
        </tr>
        <tr>
            <th>Apple</th>
            <th>Orange</th>
            <th>Screwdriver</th>
        </tr>
        <tr>
            <th>Breakfast</th>
            <td>0</td>
            <td>1</td>
            <td>0</td>
        </tr>
        <tr>
            <th>Lunch</th>
            <td>1</td>
            <td>0</td>
            <td>0</td>
        </tr>
    </table>
    </div>
</body>
</html>
