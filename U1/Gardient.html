<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-image:linear-gradient(120deg , wheat,rgb(255, 255, 88),rgb(255, 180, 40));
            background-repeat: no-repeat;
            margin: 0;
            height:100vh;
        }
        h2{
            text-align: center;
            font-size: 40px;
            background-image: linear-gradient(60deg, rgb(255, 0, 43),rgb(9, 9, 115));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <h2>Simple Linear Gradient</h2>
</body>
</html>
