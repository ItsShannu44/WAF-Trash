<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UL</title>
</head>
<body>
    <h3>Some common single-engine aircraft</h3>
    <ul type="desc">
        <li>Cessna Skyhawk</li>
        <li>piper</li>
        <li>Bob</li>
        <li>Michael</li>
    </ul>
    <ol type="I" start="4" reversed>
        <li>Cessna Skyhawk</li>
        <li>piper</li>
        <li>Bob</li>
        <li>Michael</li>
    </ol>
</body>
</html>
