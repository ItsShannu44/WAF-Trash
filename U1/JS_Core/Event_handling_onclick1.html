<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function changeColor(code){
            document.bgColor=code;
    }
    </script>
    <form action="">
        <input type="button" name="btn1" value="Red" onclick="changeColor('Red')">
        <input type="button" name="btn2" value="Green" onclick="changeColor('green')">
        <input type="button" name="btn3" value="Beige" onclick="changeColor('beige')">
    </form>
</body>
</html>
