<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Example 2: Mousehover Picture Change</h2>
    <img src="1.jpg" alt="image" border="4" width="400" height="250" onmouseover="this.src='1.jpg'" onmouseout="this.src='2.jpg'"/>
</body>
</html>
