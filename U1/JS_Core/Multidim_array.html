<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Dimentional Arrays</title>
</head>
<body>
    <p id="stu"></p>
    <script>
        var student= new Array();
        student[0]=new Array();
        student[0][0]="PES1PG25CA999";
        student[0][1]="ZZZ";
        student[1]=new Array();
        student[1][0]="PES1PG25CA965";
        student[1][1]="yyy";
        document.getElementById('stu').innerHTML='Matrix: "'+ student+ '" ';
    </script>
</body>
</html>
